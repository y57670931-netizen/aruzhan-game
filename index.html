<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Аружанға арналған хикая 💌</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  body {
    height: 100vh; width: 100vw; overflow: hidden;
    background-color: #1a0b12; color: #fff;
    display: flex; justify-content: center; align-items: center;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }

  /* Артқы фон (динамикалық өзгереді) */
  #bg-layer {
    position: absolute; inset: 0;
    background: radial-gradient(circle at center, #3d1526 0%, #11050a 100%);
    transition: background 1.5s ease;
    z-index: 1;
  }

  #game-container {
    position: relative; z-index: 2;
    width: 100%; height: 100%; max-width: 600px;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 20px; padding-bottom: 30px;
  }

  /* Кейіпкер немесе Эмодзи */
  #character {
    position: absolute; top: 25%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    font-size: 110px; opacity: 0;
    transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    filter: drop-shadow(0 0 25px rgba(255,100,150,0.5));
  }
  #character.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* Диалог терезесі */
  #dialogue-box {
    background: rgba(30, 15, 25, 0.75);
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px; padding: 24px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    position: relative;
    min-height: 160px;
  }

  #speaker-name {
    position: absolute; top: -15px; left: 20px;
    background: linear-gradient(135deg, #ff5c9b, #ff2e63);
    padding: 5px 18px; border-radius: 20px;
    font-size: 15px; font-weight: bold; letter-spacing: 1px;
    box-shadow: 0 5px 15px rgba(255, 46, 99, 0.4);
  }

  #text {
    font-size: 18px; line-height: 1.5; color: #ffe6f0;
    margin-top: 10px; min-height: 80px;
  }

  /* Таңдау батырмалары */
  #choices {
    display: flex; flex-direction: column; gap: 12px;
    margin-top: 20px; opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
  }
  #choices.show { opacity: 1; pointer-events: auto; }

  .choice-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff; padding: 16px 20px; border-radius: 16px;
    font-size: 16px; cursor: pointer; transition: all 0.2s;
    text-align: left; position: relative; overflow: hidden;
  }
  .choice-btn::before {
    content: ''; position: absolute; top:0; left:-100%; width:100%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.5s;
  }
  .choice-btn:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.15); }
  
  /* Индикатор жазу */
  .typing-indicator {
    display: inline-block; width: 8px; height: 18px;
    background: #ff5c9b; animation: blink 1s infinite;
    vertical-align: middle; margin-left: 5px;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
</head>
<body>

<div id="bg-layer"></div>

<div id="game-container">
  <div id="character">💌</div>
  
  <div id="dialogue-box">
    <div id="speaker-name">Хикая</div>
    <div id="text"></div>
    <div id="choices"></div>
  </div>
</div>

<script>
/* =========================================
   ОҚИҒА СЦЕНАРИЙІ (Story Data)
   ========================================= */
const story = {
  start: {
    bg: "radial-gradient(circle at center, #3d1526 0%, #11050a 100%)",
    char: "💌",
    speaker: "Хат",
    text: "Аружан, ертеңгі демалысыңды өзіңнің қалауыңша өткізгің келе ме?",
    choices: [
      { text: "Иә, бастайық! ✨", next: "date" }
    ]
  },
  date: {
    bg: "radial-gradient(circle at center, #2e1a47 0%, #0d0512 100%)",
    char: "🌙",
    speaker: "Ертеңгі жоспар",
    text: "Керемет! Ертең қайда барғың келеді?",
    choices: [
      { text: "Ханшатырға баруға 🏙️", next: "khan_shatyr" },
      { text: "Паркта серуендеуге 🌳", next: "park" },
      { text: "Тамақтануға 🍽️", next: "food" }
    ]
  },
  
  /* --- Ханшатыр тармағы --- */
  khan_shatyr: {
    bg: "radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%)",
    char: "🏙️",
    speaker: "Ханшатыр",
    text: "Ханшатырдың ішінде серуендеп, әдемі көріністерді тамашалаймыз ба? Әлде бірге суретке түсеміз бе?",
    choices: [
      { text: "Күмбездегі серуенді тамашалайық 🌴", next: "shatyr_walk" },
      { text: "Бірге суретке түсейік 📸", next: "shatyr_photo" }
    ]
  },
  shatyr_walk: {
    bg: "radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%)",
    char: "🌴",
    speaker: "Сен",
    text: "Мұнда тіпті қыста да жаздың жылуы бар екен. Сенімен бірге болса, кез келген жер жұмақ.",
    choices: [ { text: "Рақмет, жаным! 💖", next: "final_path" } ]
  },
  shatyr_photo: {
    bg: "radial-gradient(circle at center, #1e3a8a 0%, #0f172a 100%)",
    char: "📸",
    speaker: "Сен",
    text: "Күлімсіре! Бұл сурет біздің ең бақытты сәттеріміздің бірі ретінде қалады.",
    choices: [ { text: "Мен де осылай ойлаймын 🥰", next: "final_path" } ]
  },

  /* --- Парк тармағы --- */
  park: {
    bg: "radial-gradient(circle at center, #0f2e1c 0%, #040d08 100%)",
    char: "🌳",
    speaker: "Саябақ",
    text: "Таза ауа, жапырақтардың сыбдыры... Ертеңгі серуен керемет болады. Аспанға қарашы, бұлттар қандай әдемі.",
    choices: [
      { text: "Жұлдыздарға қарап, тілек тіле 🌠", next: "park_stars" },
      { text: "Салқындап кеттің бе? Курткаңды жауып беру 🌬️", next: "park_jacket" }
    ]
  },
  park_stars: {
    bg: "radial-gradient(circle at center, #0f2e1c 0%, #040d08 100%)",
    char: "🌠",
    speaker: "Сен",
    text: "Мен бір жұлдызға қарап, өмірімдегі ең әдемі тілекті тіледім. Ол — сенің әрдайым жанымда болуың.",
    choices: [ { text: "Ол тілек орындалады! 🌟", next: "final_path" } ]
  },
  park_jacket: {
    bg: "radial-gradient(circle at center, #0f2e1c 0%, #040d08 100%)",
    char: "🧥",
    speaker: "Сен",
    text: "Міне, киіп ал. Менің жылуым саған әрдайым жетеді.",
    choices: [ { text: "Саған сенуге болады екен 💖", next: "final_path" } ]
  },

  /* --- Тамақтану тармағы --- */
  food: {
    bg: "radial-gradient(circle at center, #4a2618 0%, #140804 100%)",
    char: "🍽️",
    speaker: "Мейрамхана",
    text: "Тәтті тағамдар мен дәмді ас... Ертеңгі кешкі ас өте керемет болады! Не істейміз?",
    choices: [
      { text: "Маған әдемі комплимент айт 💖", next: "food_love" },
      { text: "Қолымнан ұстап отыр 🤝", next: "food_hand" }
    ]
  },
  food_love: {
    bg: "radial-gradient(circle at center, #4a2618 0%, #140804 100%)",
    char: "😍",
    speaker: "Сен",
    text: "Аружан, сенің көздерің ең тәтті десерттен де тәтті, ал күлкің бүкіл әлемді жарық етеді.",
    choices: [ { text: "Рақмет, жаным... 🥰", next: "final_path" } ]
  },
  food_hand: {
    bg: "radial-gradient(circle at center, #4a2618 0%, #140804 100%)",
    char: "🫶",
    speaker: "Сен",
    text: "Қолыңды ұстағанда уақыт тоқтап қалғандай болады. Ешқайда асықпайық.",
    choices: [ { text: "Мен де осыны қалаймын 🥺", next: "final_path" } ]
  },

  /* --- Финал --- */
  final_path: {
    bg: "radial-gradient(circle at center, #5a1836 0%, #1c0510 100%)",
    char: "💖",
    speaker: "Аружан",
    text: "Бұл жоспар маған өте ұнады. Ертеңді асыға күтемін, жаным!",
    choices: [ { text: "Менің сюрпризімді көр 💌", next: "letter" } ]
  },
  letter: {
    bg: "radial-gradient(circle at center, #ff2e63 0%, #4a0f36 40%, #11050a 100%)",
    char: "💍",
    speaker: "Махаббат хаты",
    text: "Аружан, бұл кішкентай ойын тек сенің күлкіңді көру үшін жасалды. Қандай жолды таңдасаң да, менің жүрегім әрдайым сені таңдайды. Сені сүйемін!",
    choices: [ { text: "Қайта бастау 🔄", next: "start" } ]
  }
};

/* =========================================
   ОЙЫН ЛОГИКАСЫ (Game Logic)
   ========================================= */
const textEl = document.getElementById('text');
const charEl = document.getElementById('character');
const speakerEl = document.getElementById('speaker-name');
const choicesEl = document.getElementById('choices');
const bgLayer = document.getElementById('bg-layer');

let typingTimer = null;
let isTyping = false;
let currentText = "";
let currentSceneData = null;

function showScene(sceneId) {
  const scene = story[sceneId];
  currentSceneData = scene;

  // Артқы фонды өзгерту
  bgLayer.style.background = scene.bg;

  // Кейіпкерді (эмодзи) өзгерту
  charEl.classList.remove('show');
  setTimeout(() => {
    charEl.textContent = scene.char;
    charEl.classList.add('show');
  }, 300);

  // Спикер есімін өзгерту
  speakerEl.textContent = scene.speaker;

  // Таңдау батырмаларын жасыру
  choicesEl.classList.remove('show');
  choicesEl.innerHTML = '';

  // Мәтінді жазу (Typewriter effect)
  typeWriter(scene.text, () => {
    // Мәтін жазылып біткен соң таңдауларды шығару
    scene.choices.forEach(choice => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choice.text;
      btn.onclick = () => {
        showScene(choice.next);
      };
      choicesEl.appendChild(btn);
    });
    choicesEl.classList.add('show');
  });
}

function typeWriter(text, callback) {
  clearInterval(typingTimer);
  textEl.innerHTML = '';
  currentText = text;
  isTyping = true;
  let i = 0;

  // Жылдамдық: 35ms (әріп сайын)
  typingTimer = setInterval(() => {
    if (i < text.length) {
      textEl.innerHTML = text.substring(0, i + 1);
      i++;
    } else {
      clearInterval(typingTimer);
      isTyping = false;
      if (callback) callback();
    }
  }, 35);
}

// Экранды басқанда жазуды тездету (егер оқушы асығып жатса)
document.getElementById('dialogue-box').addEventListener('click', () => {
  if (isTyping) {
    clearInterval(typingTimer);
    textEl.innerHTML = currentText;
    isTyping = false;
    
    // Тездетіп бітіргенде таңдауларды шығару
    if (currentSceneData && currentSceneData.choices) {
      currentSceneData.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice.text;
        btn.onclick = (e) => {
          e.stopPropagation(); // Қосарлы басудан қорғау
          showScene(choice.next);
        };
        choicesEl.appendChild(btn);
      });
      choicesEl.classList.add('show');
    }
  }
});

// Ойынды бастау
window.onload = () => {
  showScene('start');
};
</script>
</body>
</html>
